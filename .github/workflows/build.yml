name: SukiSU Ultra Kernel Build for POCO X3 Pro (GCC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev \
            build-essential lzop cpio device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2 lz4
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone kernel source (LuffyTaro008)
        run: |
          git clone https://github.com/LuffyTaro008/android_kernel_xiaomi_vayu -b 13 --depth=1 kernel
          cd kernel

      - name: Integrate SukiSU Ultra (nongki)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
          rm -rf KernelSU/.git

      - name: Find correct defconfig
        id: defconfig
        run: |
          cd kernel
          CONFIG_FILE=$(find arch/arm64/configs -type f -name "*vayu*" | head -1)
          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: No vayu defconfig found!"
            find arch/arm64/configs -name "*.config"
            exit 1
          fi
          CONFIG_NAME=$(basename "$CONFIG_FILE" .config)
          echo "Using defconfig: $CONFIG_NAME"
          echo "name=$CONFIG_NAME" >> $GITHUB_OUTPUT

      - name: Configure kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make ${{ steps.defconfig.outputs.name }}
          # Disable problematic features
          scripts/config --disable CONFIG_HID_TRACE
          scripts/config --disable CONFIG_HID_DEBUG
          scripts/config --disable CONFIG_HUGETLBFS
          scripts/config --disable CONFIG_HUGETLB_PAGE
          scripts/config --disable CONFIG_PERF_EVENTS
          scripts/config --disable CONFIG_DEVFREQ_GOV_MSM_MEMLAT
          scripts/config --disable CONFIG_ARM_MEMLAT_MON
          scripts/config --disable CONFIG_DEBUG_INFO
          # Enable KALLSYMS dependencies
          scripts/config --enable CONFIG_DEBUG_KERNEL
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          # Disable stack protector (GCC is fine with strong, but we can keep as none for safety)
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          scripts/config --enable CONFIG_CC_STACKPROTECTOR_NONE
          # Disable LTO (Clang-specific, safe to disable for GCC)
          scripts/config --disable CONFIG_LTO_CLANG
          scripts/config --disable CONFIG_LTO
          # Disable GCC plugins to avoid extra complexity
          scripts/config --disable CONFIG_GCC_PLUGINS
          # Enable SukiSU requirements
          scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --enable CONFIG_KPM
          make olddefconfig

      - name: Build kernel image with GCC
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make -j$(nproc) Image

      - name: Package with AnyKernel3
        run: |
          cd kernel
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../Image.gz-dtb
          else
            echo "ERROR: Kernel image not found!"
            exit 1
          fi
          cd ..
          git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          cp Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_Kernel_vayu
          path: AnyKernel3/*.zip
          retention-days: 7
