name: Build SukiSU Ultra Kernel for POCO X3 Pro

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev \
            build-essential lzop cpio device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-13 lld-13 llvm-13 python2 lz4
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone kernel source (Helios Kernel for vayu)
        run: |
          git clone https://github.com/tejas101k/kernel_xiaomi_vayu -b sixteen --depth=1 kernel
          cd kernel

      - name: Integrate SukiSU Ultra (non-GKI mode)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
          rm -rf KernelSU/.git

      - name: Configure kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make vayu_defconfig
          scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_KPM
          scripts/config --disable CONFIG_HID_TRACE
          scripts/config --disable CONFIG_HID_DEBUG
          scripts/config --disable CONFIG_HUGETLBFS
          scripts/config --disable CONFIG_HUGETLB_PAGE
          scripts/config --disable CONFIG_PERF_EVENTS
          scripts/config --disable CONFIG_DEBUG_INFO
          make olddefconfig

      - name: Build kernel image
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make -j$(nproc) \
            CC=clang-13 \
            LD=ld.lld-13 \
            AR=llvm-ar-13 \
            NM=llvm-nm-13 \
            OBJCOPY=llvm-objcopy-13 \
            Image

      - name: Package with AnyKernel3
        run: |
          cd kernel
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../Image
          else
            echo "ERROR: Kernel image not found!"
            exit 1
          fi
          cd ..
          git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          cp Image AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_Kernel_vayu
          path: AnyKernel3/*.zip
